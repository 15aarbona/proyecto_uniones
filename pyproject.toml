[project]
name = "proyecto-uniones"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "15aarbona", email = "alvaroarbona2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "keras>=3.15.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pyarrow==21.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
proyecto-uniones = "proyecto_uniones:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
