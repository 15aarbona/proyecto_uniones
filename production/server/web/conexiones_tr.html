<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cálculo de conexiones · Técnicas Reunidas</title>
<style>
:root{
  --tr-navy:#002B5C;
  --tr-blue:#0066B3;
  --tr-red:#D52B1E;
  --tr-green:#2E8B57;
  --tr-bg:#F2F5F9;
  --tr-line:#D5DDE8;
  --tr-text:#1B2733;
  --tr-muted:#5E6E80;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",Helvetica,Arial,sans-serif;color:var(--tr-text);background:var(--tr-bg);display:flex;min-height:100vh}
aside{width:272px;flex:none;background:var(--tr-navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:22px 22px 18px;border-bottom:3px solid var(--tr-red)}
.brand b{display:block;font-size:19px;letter-spacing:.3px}
.brand span{font-size:12.5px;color:#9DB7D5}
nav{padding:14px 0;flex:1}
nav .grp{padding:8px 22px;font-size:12.5px;color:#9DB7D5}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:#DCE7F4;padding:11px 22px 11px 18px;font:inherit;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.07)}
nav button[aria-current="page"]{background:rgba(255,255,255,.12);border-left-color:var(--tr-red);color:#fff;font-weight:600}
.srv{padding:16px 22px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px}
.srv label{display:block;margin:0 0 4px;color:#9DB7D5}
.srv input,.srv select{width:100%;margin-bottom:10px;padding:7px 8px;border:1px solid #3C5F8A;background:#0A3A73;color:#fff;border-radius:3px;font:inherit}
main{flex:1;min-width:0;padding:28px 34px 60px}
h1{margin:0 0 4px;font-size:24px;color:var(--tr-navy)}
.sub{margin:0 0 22px;color:var(--tr-muted)}
section{background:#fff;border:1px solid var(--tr-line);border-top:3px solid var(--tr-blue);padding:20px 22px;margin-bottom:22px}
h2{margin:0 0 14px;font-size:16px;color:var(--tr-navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--tr-navy)}
.f small{font-weight:400;color:var(--tr-muted)}
.f input,.f select{width:100%;padding:8px 9px;border:1px solid #B7C3D2;border-radius:3px;background:#fff;font:inherit;color:var(--tr-text)}
.f input:focus,.f select:focus,button:focus-visible{outline:2px solid var(--tr-blue);outline-offset:1px}
.f.err input,.f.err select{border-color:var(--tr-red);background:#FFF4F3}
.f .msg{display:none;font-size:12px;color:var(--tr-red);margin-top:3px}
.f.err .msg{display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{padding:10px 20px;border:0;border-radius:3px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--tr-blue)}
.btn:hover{filter:brightness(.92)}
.btn.green{background:var(--tr-green)}
.btn.red{background:var(--tr-red)}
.btn.ghost{background:#fff;color:var(--tr-navy);border:1px solid #B7C3D2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--tr-navy);color:#fff;text-align:left;padding:8px 10px;white-space:nowrap;font-weight:600}
td{padding:7px 10px;border-bottom:1px solid var(--tr-line);white-space:nowrap}
tr:nth-child(even) td{background:#F7F9FC}
td.x button{background:none;border:0;color:var(--tr-red);cursor:pointer;font-size:17px}
#res input.cell{width:100%;min-width:64px;border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:3px 5px;border-radius:2px}
#res input.cell:hover{border-color:var(--tr-line)}
#res input.cell:focus{border-color:var(--tr-blue);background:#fff;outline:none}
.empty{color:var(--tr-muted);padding:6px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-weight:600;font-size:12px;color:#fff}
.badge.ok{background:var(--tr-green)}
.badge.bad{background:var(--tr-red)}
#status{margin-top:14px;padding:10px 14px;border-left:4px solid var(--tr-blue);background:#EAF3FB;display:none}
#status.bad{border-color:var(--tr-red);background:#FDEDEB}
#status.ok{border-color:var(--tr-green);background:#EAF6EF}
#status pre{margin:6px 0 0;white-space:pre-wrap;font-size:12.5px}
@media(max-width:820px){
  body{flex-direction:column}
  aside{width:auto}
  nav{padding:6px 0}
  main{padding:20px 14px 50px}
}
</style>
</head>
<body>

<aside>
  <div class="brand"><b>TÉCNICAS REUNIDAS</b><span>Cálculo de conexiones</span></div>
  <nav aria-label="Tipos de conexión">
    <div class="grp">Conexiones</div>
    <div id="menu"></div>
  </nav>
  <div class="srv">
    <label for="srvUrl">URL del servidor</label>
    <input id="srvUrl">
    <label for="model">Modelo</label>
    <select id="model"></select>
  </div>
</aside>

<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <section>
    <h2>Nueva combinación</h2>
    <div class="grid" id="form"></div>
    <div class="actions">
      <button class="btn" id="add">Añadir a la tabla</button>
      <button class="btn ghost" id="reset">Limpiar campos</button>
    </div>
  </section>

  <section>
    <h2>Combinaciones a pre-diseñar (<span id="count">0</span>)</h2>
    <div class="tablewrap" id="tbl"></div>
    <div class="actions">
      <button class="btn red" id="send" disabled>1. Pre-diseñar con IA (/predict)</button>
      <button class="btn ghost" id="clear" disabled>Vaciar tabla</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section id="resSec" style="display:none">
    <h2>Resultados del servidor</h2>
    <div class="tablewrap" id="res"></div>
    <div class="actions">
      <button class="btn green" id="checkBtn">2. Comprobar AISC 360-10 (/check)</button>
    </div>
  </section>

  <section id="checkSec" style="display:none">
    <h2>Resultados de la comprobación AISC 360-10</h2>
    <div class="tablewrap" id="checkRes"></div>
  </section>
</main>

<script>
/* =====================================================================
   1) CONFIGURACIÓN DEL SERVIDOR
   ===================================================================== */
const SERVER_URL = location.protocol.startsWith("http") ? location.origin : "http://localhost:8080";   // URL base de tu servidor FastAPI

/* =====================================================================
   2) CONEXIONES Y OPCIONES DE LOS DESPLEGABLES
   ---------------------------------------------------------------------
   >>> AQUÍ RELLENAS LAS OPCIONES. <<<
   Cada campo con type:"select" tiene una lista  options: [ ]  vacía.
   Mete los valores que quieras que se puedan elegir, por ejemplo:
       options: ["IPE200", "IPE240", "HEA200"]
       options: [0, 25, 50, 75, 100]      (los números se envían como número)
   `key` es el nombre exacto de la columna que se envía al servidor.
   Para añadir otra página de conexión, copia un bloque dentro de CONEXIONES.
   ===================================================================== */
// Listas de ejemplo: se sustituyen por las del modelo en GET /options al cargar la página.
const PERFILES_EJEMPLO = ["IPE200","IPE300","HEA200","HEA300","HEB280","HEB320","W610X195","W690X152"];
const GRADOS_EJEMPLO = ["S355JR"];
const CLASES_EJEMPLO = ["10.9","A325M"];

const CONEXIONES = [
  {
    id: "momento-atornillada",
    nombre: "Conexión a momento atornillada",
    descripcion: "Predicción inteligente por IA y comprobación estructural AISC 360-10.",
    endpoint: "/predict",
    campos: [
      { key: "UNICODE",        label: "UNICODE",        type: "text",   hint: "identificador" },
      { key: "BEAM",           label: "BEAM",           type: "combo",  options: PERFILES_EJEMPLO.slice(), hint: "viga" },
      { key: "COLUMN",         label: "COLUMN",         type: "combo",  options: PERFILES_EJEMPLO.slice(), hint: "columna" },
      { key: "ratio_moment",   label: "ratio_moment",   type: "text",   hint: "0–1" },
      { key: "ratio_shear",    label: "ratio_shear",    type: "text",   hint: "0–1" },
      { key: "ratio_axial",    label: "ratio_axial",    type: "text",   hint: "0–1" },
      { key: "grado_acero",    label: "grado_acero",    type: "select", options: GRADOS_EJEMPLO.slice(), required: false },
      { key: "clase_tornillo", label: "clase_tornillo", type: "select", options: CLASES_EJEMPLO.slice(), required: false },
    ],
  },
];


/* =====================================================================
   3) LÓGICA (no hace falta tocar)
   ===================================================================== */
const $ = id => document.getElementById(id);
const state = {};
let current = CONEXIONES[0];
const S = () => state[current.id] ||= { rows: [], results: [] };

$("srvUrl").value = SERVER_URL;

function renderMenu(){
  $("menu").innerHTML = "";
  CONEXIONES.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c.nombre;
    if (c.id === current.id) b.setAttribute("aria-current", "page");
    b.onclick = () => { current = c; renderAll(); };
    $("menu").appendChild(b);
  });
}

function renderForm(){
  const form = $("form");
  form.innerHTML = "";
  current.campos.forEach(c => {
    const d = document.createElement("div");
    d.className = "f"; d.dataset.key = c.key;
    const id = "in_" + c.key;
    const lab = `<label for="${id}">${c.label}${c.hint ? ` <small>· ${c.hint}</small>` : ""}</label>`;
    let ctl;
    if (c.type === "select"){
      const opts = (c.options || []).map((o, i) => `<option value="${i}"${o === c.default ? " selected" : ""}>${o}</option>`).join("");
      ctl = `<select id="${id}"><option value="">— Selecciona —</option>${opts}</select>`;
    } else if (c.type === "combo"){
      const dl = "dl_" + c.key;
      ctl = `<input id="${id}" list="${dl}" autocomplete="off" placeholder="Escribe para buscar">` +
            `<datalist id="${dl}">${(c.options || []).map(o => `<option value="${o}">`).join("")}</datalist>`;
    } else {
      ctl = `<input id="${id}" type="text" autocomplete="off">`;
    }
    d.innerHTML = lab + ctl + `<div class="msg"></div>`;
    form.appendChild(d);
  });
}

function readForm(){
  let ok = true; const row = {};
  current.campos.forEach(c => {
    const box = $("form").querySelector(`[data-key="${c.key}"]`);
    const el = $("in_" + c.key); let msg = "";
    let val = el.value.trim();
    const optional = c.required === false;
    if (c.type === "select"){
      if (val === ""){ if (!optional) msg = "Elige una opción"; }
      else val = c.options[Number(val)];
    } else if (c.type === "combo"){
      if (val === ""){ if (!optional) msg = "Obligatorio"; }
      else if ((c.options || []).length){
        const m = c.options.find(o => String(o).toLowerCase() === val.toLowerCase());
        if (m === undefined) msg = "No está en el catálogo"; else val = m;
      }
    } else if (val === ""){ if (!optional) msg = "Obligatorio"; }
    box.classList.toggle("err", !!msg);
    box.querySelector(".msg").textContent = msg;
    if (msg) ok = false; else row[c.key] = val;
  });
  return ok ? row : null;
}

function table(rows, cols, withDelete){
  if (!rows.length) return `<div class="empty">No hay combinaciones en la tabla.</div>`;
  const head = cols.map(c => `<th>${c}</th>`).join("") + (withDelete ? "<th></th>" : "");
  const body = rows.map((r, i) =>
    "<tr>" + cols.map(c => `<td>${r[c] ?? ""}</td>`).join("") +
    (withDelete ? `<td class="x"><button data-del="${i}" title="Quitar fila">✕</button></td>` : "") + "</tr>"
  ).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderTable(){
  const rows = S().rows;
  $("tbl").innerHTML = table(rows, current.campos.map(c => c.key), true);
  $("count").textContent = rows.length;
  $("send").disabled = $("clear").disabled = !rows.length;
  $("tbl").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); renderTable(); });
}

function renderResults(){
  const res = S().results;
  $("resSec").style.display = res.length ? "" : "none";
  if (!res.length) return;
  const cols = [...new Set(res.flatMap(r => Object.keys(r)))];
  const head = cols.map(c => `<th>${c}</th>`).join("");
  const body = res.map((r, i) =>
    "<tr>" + cols.map(c => {
      const v = r[c] ?? "";
      const esc = String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
      return `<td><input class="cell" data-row="${i}" data-col="${c}" value="${esc}"></td>`;
    }).join("") + "</tr>"
  ).join("");
  $("res").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  // Los valores editados se guardan en el estado (para reutilizarlos más adelante).
  $("res").querySelectorAll("input.cell").forEach(inp => {
    inp.addEventListener("input", () => {
      S().results[+inp.dataset.row][inp.dataset.col] = inp.value;
    });
  });
}

function renderCheckResults(){
  const res = S().checkedResults;
  $("checkSec").style.display = res.length ? "" : "none";
  if (!res.length) return;

  let html = `<table><thead><tr>
    <th>UNICODE</th><th>Estado</th><th>Ratio Pésimo</th><th>Chequeo Crítico</th><th>Detalle Comprobaciones</th>
  </tr></thead><tbody>`;

  res.forEach((r, i) => {
    const badge = r.cumple ? `<span class="badge ok">CUMPLE</span>` : `<span class="badge bad">NO CUMPLE</span>`;
    
    let ratiosList = (r.ratios || []).map(f => `<li><b>${f.descripcion}:</b> ${f.ratio !== null ? f.ratio.toFixed(3) : 'N/A'}</li>`).join("");
    let compList = (r.complementarios || []).map(c => `<li><b>${c.descripcion}:</b> ${c.resultado}</li>`).join("");

    html += `<tr>
      <td>${r.UNICODE || (i+1)}</td>
      <td>${badge}</td>
      <td><b>${r.ratio_pesimo ?? 'N/A'}</b></td>
      <td>${r.descripcion_ratio_pesimo || 'N/A'}</td>
      <td>
        <details>
          <summary>Ver 18 Ratios y 33 Geométricos</summary>
          <div style="padding:8px 0;">
            <p style="margin:4px 0;"><b>Resistencias y Ratios:</b></p>
            <ul style="margin:0;padding-left:18px;">${ratiosList}</ul>
            <p style="margin:8px 0 4px;"><b>Geometría y Complementarias:</b></p>
            <ul style="margin:0;padding-left:18px;">${compList}</ul>
          </div>
        </details>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;
  $("checkRes").innerHTML = html;
}

function setStatus(kind, text, detail){
  const s = $("status");
  s.className = kind; s.style.display = text ? "block" : "none";
  s.innerHTML = `<b>${text}</b>` + (detail ? `<pre></pre>` : "");
  if (detail) s.querySelector("pre").textContent = detail;
}

function renderAll(){
  $("title").textContent = current.nombre;
  $("sub").textContent = current.descripcion;
  renderMenu(); renderForm(); renderTable(); renderResults(); renderCheckResults(); setStatus("", "");
}

$("add").onclick = () => {
  const row = readForm(); if (!row) return;
  S().rows.push(row); renderTable(); renderForm();
  $("in_" + current.campos[0].key).focus();
};
$("reset").onclick = renderForm;
$("clear").onclick = () => { S().rows = []; S().results = []; S().checkedResults = []; renderTable(); renderResults(); renderCheckResults(); setStatus("", ""); };

$("send").onclick = async () => {
  const st = S(); const btn = $("send");
  btn.disabled = true; setStatus("", "Enviando predicción " + st.rows.length + " combinaciones…");
  try {
    const r = await fetch(current.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, rows: st.rows }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok){
      let detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail ?? data, null, 2);
      setStatus("bad", `El servidor respondió ${r.status}`, detail);
    } else {
      st.results = data.rows || [];
      renderResults();
      setStatus("ok", `Predicción completada con el modelo ${data.model_name ?? ""}: ${st.results.length} uniones pre-diseñadas.`);
    }
  } catch (e){
    setStatus("bad", "No se pudo conectar con el servidor", e.message);
  }
  btn.disabled = !st.rows.length;
};

$("checkBtn").onclick = async () => {
  const st = S(); const btn = $("checkBtn");
  btn.disabled = true; setStatus("", "Comprobando " + st.results.length + " uniones con AISC 360-10…");
  try {
    const r = await fetch($("srvUrl").value.replace(/\/$/, "") + "/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows: st.results }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok){
      setStatus("bad", `Error al comprobar (${r.status})`, JSON.stringify(data, null, 2));
    } else {
      st.checkedResults = data.rows || [];
      renderCheckResults();
      setStatus("ok", `Comprobación AISC 360-10 finalizada con éxito.`);
    }
  } catch (e){
    setStatus("bad", "Error enviando la comprobación", e.message);
  }
  btn.disabled = false;
};

async function loadModels(){
  try{
    const r = await fetch("/models");
    const o = await r.json();
    const sel = $("model");
    sel.innerHTML = (o.available_models || []).map(m => `<option value="${m}">${m}</option>`).join("");
    if (o.default_model && (o.available_models || []).includes(o.default_model)) sel.value = o.default_model;
  } catch(e){}
}

async function loadOptions(){
  try{
    const model = $("model").value;
    const r = await fetch("/options?model=" + encodeURIComponent(model));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const o = await r.json();
    CONEXIONES.forEach(con => con.campos.forEach(c => {
      if ((c.type === "combo" || c.type === "select") && Array.isArray(o[c.key])){
        c.options = o[c.key].slice();
      }
    }));
    renderForm();
  } catch (e){}
}
$("model").onchange = loadOptions;

renderAll();
loadModels().then(loadOptions);
</script>
</body>
</html>
