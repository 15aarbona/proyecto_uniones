<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cálculo de conexiones · Técnicas Reunidas</title>
<!-- Librería SheetJS para lectura y exportación de Excel/CSV localmente -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --tr-navy:#002B5C;
  --tr-blue:#0066B3;
  --tr-red:#D52B1E;
  --tr-green:#2E8B57;
  --tr-bg:#F2F5F9;
  --tr-line:#D5DDE8;
  --tr-text:#1B2733;
  --tr-muted:#5E6E80;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",Helvetica,Arial,sans-serif;color:var(--tr-text);background:var(--tr-bg);display:flex;min-height:100vh}
aside{width:272px;flex:none;background:var(--tr-navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:22px 22px 18px;border-bottom:3px solid var(--tr-red)}
.brand b{display:block;font-size:19px;letter-spacing:.3px}
.brand span{font-size:12.5px;color:#9DB7D5}
nav{padding:14px 0;flex:1}
nav .grp{padding:8px 22px;font-size:12.5px;color:#9DB7D5}
.srv{padding:16px 22px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px}
.srv label{display:block;margin:0 0 4px;color:#9DB7D5}
.srv input,.srv select{width:100%;margin-bottom:10px;padding:7px 8px;border:1px solid #3C5F8A;background:#0A3A73;color:#fff;border-radius:3px;font:inherit}
main{flex:1;min-width:0;padding:28px 34px 60px}
h1{margin:0 0 4px;font-size:24px;color:var(--tr-navy)}
.sub{margin:0 0 22px;color:var(--tr-muted)}
section{background:#fff;border:1px solid var(--tr-line);border-top:3px solid var(--tr-blue);padding:20px 22px;margin-bottom:22px}
h2{margin:0 0 14px;font-size:16px;color:var(--tr-navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--tr-navy)}
.f small{font-weight:400;color:var(--tr-muted)}
.f input,.f select{width:100%;padding:8px 9px;border:1px solid #B7C3D2;border-radius:3px;background:#fff;font:inherit;color:var(--tr-text)}
.f input:focus,.f select:focus,button:focus-visible{outline:2px solid var(--tr-blue);outline-offset:1px}
.f.err input,.f.err select{border-color:var(--tr-red);background:#FFF4F3}
.f .msg{display:none;font-size:12px;color:var(--tr-red);margin-top:3px}
.f.err .msg{display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{padding:10px 20px;border:0;border-radius:3px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--tr-blue)}
.btn:hover{filter:brightness(.92)}
.btn.green{background:var(--tr-green)}
.btn.red{background:var(--tr-red)}
.btn.ghost{background:#fff;color:var(--tr-navy);border:1px solid #B7C3D2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-icon{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:3px;padding:2px 6px;font-size:11px;cursor:pointer;margin-left:6px;font-weight:normal}
.btn-icon:hover{background:rgba(255,255,255,.35)}
.hbtn{background:#EEF3F9;border:1px solid var(--tr-line);border-radius:3px;cursor:pointer;font-size:17px;padding:3px 9px;line-height:1.2}
.hbtn:hover{background:#E1EAF5}
.sec-head{display:flex;align-items:center;gap:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--tr-navy);color:#fff;text-align:left;padding:8px 10px;white-space:nowrap;font-weight:600}
td{padding:7px 10px;border-bottom:1px solid var(--tr-line);white-space:nowrap}
tr:nth-child(even) td{background:#F7F9FC}
td.x button{background:none;border:0;color:var(--tr-red);cursor:pointer;font-size:17px}
#res input.cell{width:100%;min-width:64px;border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:3px 5px;border-radius:2px}
#res input.cell:hover:not([readonly]){border-color:var(--tr-line)}
#res input.cell:focus:not([readonly]){border-color:var(--tr-blue);background:#fff;outline:none}
.empty{color:var(--tr-muted);padding:6px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-weight:600;font-size:12px;color:#fff}
.badge.ok{background:var(--tr-green)}
.badge.bad{background:var(--tr-red)}
.badge.mod{background:var(--tr-blue)}
.st{font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--tr-text)}
#res tr.row-ok td{background:#E9F6EF}
#res tr.row-bad td{background:#FDEDEB}
#res tr.row-mod td{background:#EAF3FB}
#res th:first-child,#res td:first-child{width:36px;text-align:center}
#status{margin-top:14px;padding:10px 14px;border-left:4px solid var(--tr-blue);background:#EAF3FB;display:none}
#status.bad{border-color:var(--tr-red);background:#FDEDEB}
#status.ok{border-color:var(--tr-green);background:#EAF6EF}
#status pre{margin:6px 0 0;white-space:pre-wrap;font-size:12.5px}
@media(max-width:820px){
  body{flex-direction:column}
  aside{width:auto;position:static;height:auto;overflow:visible}
  nav{padding:6px 0}
  main{padding:20px 14px 50px}
}
</style>
</head>
<body>

<aside>
  <div class="brand"><b>TÉCNICAS REUNIDAS</b><span>Cálculo de conexiones</span></div>
  <nav aria-label="Tipos de conexión">
    <div class="grp">Conexiones</div>
    <div id="menu"></div>
  </nav>
  <div class="srv">
    <label for="model">Modelo</label>
    <select id="model"></select>
  </div>
</aside>

<main>
  <h1 id="title">Conexión a momento atornillada</h1>
  <p class="sub" id="sub">Los campos se generan según el modelo seleccionado.</p>

  <section>
    <h2>Nueva combinación</h2>
    <div class="grid" id="form"></div>
    <div class="actions">
      <button class="btn" id="add">Añadir a la tabla</button>
      <button class="btn ghost" id="reset">Limpiar campos</button>
      <button class="btn ghost" id="btnUploadExcel">📁 Cargar Excel / CSV</button>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none">
    </div>
  </section>

  <section>
    <h2>Combinaciones a pre-diseñar (<span id="count">0</span>)</h2>
    <div class="tablewrap" id="tbl"></div>
    <div class="actions">
      <button class="btn" id="send" disabled>Pre-diseñar con IA</button>
      <button class="btn ghost" id="clear" disabled>Vaciar tabla</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section id="resSec" style="display:none">
    <h2 class="sec-head">
      <span>Resultados del servidor <small style="font-weight:400;color:var(--tr-muted)">· editable</small></span>
      <button class="hbtn" id="exportResultsExcel" title="Descargar resultados en Excel">📥</button>
    </h2>
    <div class="tablewrap" id="res"></div>
    <div class="actions">
      <button class="btn" id="checkBtn" disabled>Comprobar todas las entradas</button>
      <button class="btn ghost" id="markValid">Marcar "CUMPLE"</button>
      <button class="btn ghost" id="markMod">Marcar "MODIFICADO"</button>
      <button class="btn green" id="sendMarked" disabled>Enviar conexiones marcadas</button>
    </div>
  </section>

  <section id="checkSec" style="display:none">
    <h2 class="sec-head">
      <span>Resultados de la comprobación AISC 360-10</span>
      <button class="hbtn" id="exportCheckExcel" title="Descargar comprobaciones en Excel">📥</button>
    </h2>
    <div class="tablewrap" id="checkRes"></div>
  </section>
</main>

<script>
/* =====================================================================
   Estado
   ===================================================================== */
const $ = id => document.getElementById(id);
let SCHEMA = { model: null, inputs: [], result_columns: [] };
const state = { rows: [], results: [], checked: [], marked: [], status: [] };
const escHtml = v => String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr = v => escHtml(v).replace(/"/g,"&quot;");

/* =====================================================================
   Formulario dinámico (desde GET /schema)
   ===================================================================== */
function renderForm(){
  const form = $("form");
  form.innerHTML = "";
  if (!SCHEMA.inputs.length){
    form.innerHTML = `<div class="empty">Sin esquema: no hay modelo cargado.</div>`;
    return;
  }
  SCHEMA.inputs.forEach(c => {
    const box = document.createElement("div");
    box.className = "f"; box.dataset.key = c.key;
    const id = "in_" + c.key;
    const desc = c.description ? ` <small>· ${escHtml(c.description)}</small>` : "";
    const lab = `<label for="${id}">${escHtml(c.key)}${desc}</label>`;
    let ctl;
    if (c.type === "categorical"){
      const opts = c.options || [];
      if (opts.length > 25){
        const dl = "dl_" + c.key;
        ctl = `<input id="${id}" list="${dl}" autocomplete="off" placeholder="Escribe para buscar">` +
              `<datalist id="${dl}">${opts.map(o => `<option value="${escAttr(o)}">`).join("")}</datalist>`;
      } else {
        ctl = `<select id="${id}"><option value="">— Selecciona —</option>` +
              opts.map(o => `<option value="${escAttr(o)}">${escHtml(o)}</option>`).join("") + `</select>`;
      }
    } else if (c.type === "bool"){
      ctl = `<select id="${id}"><option value="">—</option><option value="true">true</option><option value="false">false</option></select>`;
    } else if (c.type === "number"){
      ctl = `<input id="${id}" type="number" step="any" autocomplete="off">`;
    } else {
      ctl = `<input id="${id}" type="text" autocomplete="off">`;
    }
    box.innerHTML = lab + ctl + `<div class="msg"></div>`;
    form.appendChild(box);
  });
}

function readForm(){
  let ok = true; const row = {};
  SCHEMA.inputs.forEach(c => {
    const box = $("form").querySelector(`[data-key="${c.key}"]`);
    const el = $("in_" + c.key);
    const val = (el && el.value != null ? el.value : "").trim();
    let msg = "";
    if (val !== "" && c.type === "categorical" && Array.isArray(c.options) && c.options.length){
      const m = c.options.find(o => String(o).toLowerCase() === val.toLowerCase());
      if (m === undefined) msg = "No está en el catálogo"; else row[c.key] = m;
    } else if (val !== ""){
      row[c.key] = (c.type === "number") ? Number(val) : val;
    }
    box.classList.toggle("err", !!msg);
    box.querySelector(".msg").textContent = msg;
    if (msg) ok = false;
  });
  return ok ? row : null;
}

/* =====================================================================
   Carga de archivos Excel / CSV (SheetJS)
   ===================================================================== */
$("btnUploadExcel").onclick = () => $("excelFileInput").click();

$("excelFileInput").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

      if (!json.length) {
        setStatus("bad", "El archivo Excel está vacío o no se pudo leer.");
        return;
      }

      if (!SCHEMA.inputs.length) {
        setStatus("bad", "No hay un esquema de modelo cargado.");
        return;
      }

      let count = 0;
      json.forEach(rawRow => {
        const rowNorm = {};
        Object.keys(rawRow).forEach(k => {
          rowNorm[k.trim().toLowerCase()] = rawRow[k];
        });

        const newRow = {};
        SCHEMA.inputs.forEach(c => {
          const keyLower = c.key.toLowerCase();
          if (rowNorm[keyLower] !== undefined && rowNorm[keyLower] !== "") {
            let val = rowNorm[keyLower];
            if (c.type === "number" && typeof val !== "number") {
              const num = Number(String(val).replace(",", "."));
              if (!isNaN(num)) val = num;
            }
            newRow[c.key] = val;
          }
        });

        if (Object.keys(newRow).length > 0) {
          state.rows.push(newRow);
          count++;
        }
      });

      renderTable();
      setStatus("ok", `Se han cargado ${count} filas desde "${file.name}".`);
    } catch (err) {
      setStatus("bad", "Error procesando el archivo Excel/CSV", err.message);
    }
    $("excelFileInput").value = "";
  };
  reader.readAsArrayBuffer(file);
};

/* =====================================================================
   Tablas
   ===================================================================== */
function table(rows, cols, withDelete){
  if (!rows.length) return `<div class="empty">Todavía no hay combinaciones. Rellena el formulario o carga un Excel.</div>`;
  const head = cols.map(c => `<th>${escHtml(c)}</th>`).join("") + (withDelete ? "<th></th>" : "");
  const body = rows.map((r, i) =>
    "<tr>" + cols.map(c => `<td>${escHtml(r[c] ?? "")}</td>`).join("") +
    (withDelete ? `<td class="x"><button data-del="${i}" title="Quitar fila" aria-label="Quitar fila ${i+1}">✕</button></td>` : "") + "</tr>"
  ).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderTable(){
  const cols = SCHEMA.inputs.map(c => c.key);
  $("tbl").innerHTML = table(state.rows, cols, true);
  $("count").textContent = state.rows.length;
  $("send").disabled = $("clear").disabled = !state.rows.length;
  $("tbl").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { state.rows.splice(+b.dataset.del, 1); renderTable(); });
}

/* Rellena unívocamente una columna para todas las filas de los resultados */
function bulkFillColumn(colName){
  if (!state.results.length) return;
  if (colName.toLowerCase() === "unicode") return; // Prevención adicional para la columna Unicode
  
  const sampleVal = state.results[0][colName] ?? "";
  const newVal = prompt(`Introduce el nuevo valor para la columna '${colName}' en TODAS las filas (${state.results.length} filas):`, sampleVal);
  if (newVal === null) return; // Cancelado por el usuario

  state.results.forEach((r, i) => {
    r[colName] = newVal;
    state.status[i] = "MODIFICADO";
    state.marked[i] = false;
  });
  
  renderResults();
  renderCheckResults(); // Reflejar cambio en la tabla inferior de comprobaciones inmediatamente
}

function renderResults(){
  const res = state.results;
  $("resSec").style.display = res.length ? "" : "none";
  $("checkBtn").disabled = !res.length;
  if (!res.length){ updateSendMarked(); return; }
  const cols = SCHEMA.result_columns.length ? SCHEMA.result_columns
                                            : [...new Set(res.flatMap(r => Object.keys(r)))];

  // Encabezados: casilla marcar/desmarcar todas + columnas + comprobación.
  const head = `<th><input type="checkbox" id="resAll" title="Marcar / desmarcar todas"></th>` + cols.map(c => {
    const isUnicode = c.toLowerCase() === "unicode";
    return `
    <th>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
        <span>${escHtml(c)}</span>
        ${isUnicode ? '' : `<button class="btn-icon" onclick="bulkFillColumn('${escAttr(c)}')" title="Rellenar toda la columna '${escAttr(c)}'">⚡ Rellenar</button>`}
      </div>
    </th>
    `;
  }).join("") + `<th>Comprobación</th>`;

  const body = res.map((r, i) => {
    const st = state.status[i] || "";
    const stCls = st === "CUMPLE" ? "ok" : st === "NO CUMPLE" ? "bad" : st === "MODIFICADO" ? "mod" : "";
    const rowCls = st === "CUMPLE" ? "row-ok" : st === "NO CUMPLE" ? "row-bad" : st === "MODIFICADO" ? "row-mod" : "";
    return `<tr class="${rowCls}">` +
      `<td><input type="checkbox" class="rowchk" data-row="${i}" ${state.marked[i] ? "checked" : ""}></td>` +
      cols.map(c => {
        const v = r[c] ?? "";
        const isUnicode = c.toLowerCase() === "unicode";
        if (isUnicode) {
          return `<td><input class="cell" readonly data-row="${i}" data-col="${escAttr(c)}" value="${escAttr(v)}" title="Columna no editable" style="cursor:not-allowed;color:var(--tr-muted);"></td>`;
        }
        return `<td><input class="cell" data-row="${i}" data-col="${escAttr(c)}" value="${escAttr(v)}"></td>`;
      }).join("") +
      `<td class="st ${stCls}">${escHtml(st)}</td>` +
    "</tr>";
  }).join("");

  $("res").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

  // Editar una celda -> estado MODIFICADO (y se desmarca).
  $("res").querySelectorAll("input.cell:not([readonly])").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = +inp.dataset.row;
      state.results[i][inp.dataset.col] = inp.value;
      markModified(i);
    });
  });
  // Casillas por fila.
  $("res").querySelectorAll("input.rowchk").forEach(chk => {
    chk.addEventListener("change", () => { state.marked[+chk.dataset.row] = chk.checked; updateSendMarked(); });
  });
  // Casilla de cabecera: marcar / desmarcar todas (sincronizada con el estado).
  const all = $("resAll");
  if (all){
    const n = state.marked.filter(Boolean).length;
    all.checked = state.results.length > 0 && n === state.results.length;
    all.indeterminate = n > 0 && n < state.results.length;
    all.addEventListener("change", () => {
      state.marked = state.results.map(() => all.checked);
      renderResults();
    });
  }
  updateSendMarked();
}

function markModified(i){
  state.status[i] = "MODIFICADO";
  state.marked[i] = false;
  const row = $("res").querySelectorAll("tbody tr")[i];
  if (row){
    row.className = "row-mod";
    const stCell = row.querySelector("td.st");
    if (stCell){ stCell.textContent = "MODIFICADO"; stCell.className = "st mod"; }
    const chk = row.querySelector("input.rowchk");
    if (chk) chk.checked = false;
  }
  // Reflejar el cambio tambien en el informe de comprobaciones.
  renderCheckResults();
  updateSendMarked();
}

function updateSendMarked(){
  $("sendMarked").disabled = !state.marked.some(Boolean);
}

function renderCheckResults(){
  const res = state.checked;
  $("checkSec").style.display = res.length ? "" : "none";
  if (!res.length) return;

  let html = `<table><thead><tr>
    <th>Unicode</th><th>Estado</th><th>Ratio pésimo</th><th>Chequeo crítico</th><th>Detalle</th>
  </tr></thead><tbody>`;

  res.forEach((r, i) => {
    const st = state.status[i] || "";
    const badge = st === "MODIFICADO"
      ? `<span class="badge mod">MODIFICADO</span>`
      : (r.cumple ? `<span class="badge ok">CUMPLE</span>`
                  : `<span class="badge bad">NO CUMPLE</span>`);
    const ratiosList = (r.ratios || []).map(f =>
      `<li><b>${escHtml(f.descripcion)}:</b> ${f.ratio !== null && f.ratio !== undefined ? Number(f.ratio).toFixed(3) : 'N/A'}</li>`).join("");
    const compList = (r.complementarios || []).map(c =>
      `<li><b>${escHtml(c.descripcion)}:</b> ${escHtml(c.resultado)}</li>`).join("");
    const label = r.Unicode || r.UNICODE || (i + 1);

    html += `<tr>
      <td>${escHtml(label)}</td>
      <td>${badge}</td>
      <td><b>${r.ratio_pesimo ?? 'N/A'}</b></td>
      <td>${escHtml(r.descripcion_ratio_pesimo || 'N/A')}</td>
      <td><details><summary>Ver ratios y geométricos</summary>
        <div style="padding:8px 0;">
          <p style="margin:4px 0;"><b>Resistencias y ratios:</b></p>
          <ul style="margin:0;padding-left:18px;">${ratiosList}</ul>
          <p style="margin:8px 0 4px;"><b>Geometría y complementarias:</b></p>
          <ul style="margin:0;padding-left:18px;">${compList}</ul>
        </div></details></td>
    </tr>`;
  });

  html += `</tbody></table>`;
  $("checkRes").innerHTML = html;
}

/* =====================================================================
   Exportación de Comprobaciones a Excel
   ===================================================================== */
$("exportCheckExcel").onclick = () => {
  const res = state.checked;
  if (!res.length) {
    setStatus("bad", "No hay comprobaciones para exportar.");
    return;
  }

  const exportRows = res.map((r, idx) => {
    const rowObj = {
      "UNICODE": r.Unicode || r.UNICODE || (idx + 1),
      "Estado Global": r.cumple ? "CUMPLE" : "NO CUMPLE",
      "Ratio Pésimo": r.ratio_pesimo ?? "",
      "Chequeo Crítico": r.descripcion_ratio_pesimo || ""
    };

    // Agregar campos base de geometría/materiales
    Object.keys(r).forEach(k => {
      if (!["ratios", "complementarios", "cumple", "ratio_pesimo", "descripcion_ratio_pesimo"].includes(k)) {
        rowObj[k] = r[k];
      }
    });

    // Agregar los 18 ratios de resistencia como columnas individuales
    if (Array.isArray(r.ratios)) {
      r.ratios.forEach(ratioItem => {
        const keyName = `Ratio: ${ratioItem.descripcion}`;
        rowObj[keyName] = (ratioItem.ratio !== null && ratioItem.ratio !== undefined) ? ratioItem.ratio : "N/A";
      });
    }

    // Agregar las 33 comprobaciones geométricas como columnas individuales
    if (Array.isArray(r.complementarios)) {
      r.complementarios.forEach(compItem => {
        const keyName = `Geometría: ${compItem.descripcion}`;
        rowObj[keyName] = compItem.resultado;
      });
    }

    return rowObj;
  });

  const worksheet = XLSX.utils.json_to_sheet(exportRows);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Comprobaciones AISC360");
  
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(workbook, `Comprobaciones_AISC36010_${dateStr}.xlsx`);
  setStatus("ok", "Exportación a Excel completada con éxito.");
};

$("exportResultsExcel").onclick = () => {
  if (!state.results.length) {
    setStatus("bad", "No hay resultados para exportar.");
    return;
  }
  const worksheet = XLSX.utils.json_to_sheet(state.results);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Resultados");
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(workbook, `Resultados_${dateStr}.xlsx`);
  setStatus("ok", "Resultados exportados a Excel.");
};

function setStatus(kind, text, detail){
  const s = $("status");
  s.className = kind; s.style.display = text ? "block" : "none";
  s.innerHTML = `<b>${escHtml(text)}</b>` + (detail ? `<pre></pre>` : "");
  if (detail) s.querySelector("pre").textContent = detail;
}

/* =====================================================================
   Acciones
   ===================================================================== */
$("add").onclick = () => {
  const row = readForm(); if (!row) return;
  state.rows.push(row); renderTable(); renderForm();
  const first = SCHEMA.inputs[0];
  if (first) $("in_" + first.key).focus();
};
$("reset").onclick = renderForm;
$("clear").onclick = () => {
  state.rows = []; state.results = []; state.checked = []; state.marked = []; state.status = [];
  renderTable(); renderResults(); renderCheckResults(); setStatus("", "");
};

$("send").onclick = async () => {
  const btn = $("send");
  btn.disabled = true; setStatus("", "Pre-diseñando " + state.rows.length + " combinaciones…");
  try {
    const r = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, rows: state.rows }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok){
      let detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail ?? data, null, 2);
      if (data.missing) detail += "\n\nFaltan:\n" + JSON.stringify(data.missing, null, 2);
      if (data.expected) detail += "\n\nEl modelo espera:\n" + data.expected.join(", ");
      setStatus("bad", `El servidor respondió ${r.status}`, detail);
    } else {
      state.results = data.rows || [];
      state.checked = [];
      state.marked = state.results.map(() => false);
      state.status = state.results.map(() => "");
      renderResults(); renderCheckResults();
      setStatus("ok", `Predicción completada con el modelo ${data.model_name ?? ""}: ${state.results.length} uniones. Edita si quieres y pulsa "Comprobar".`);
    }
  } catch (e){
    setStatus("bad", "No se pudo conectar con el servidor", e.message);
  }
  btn.disabled = !state.rows.length;
};

$("checkBtn").onclick = async () => {
  const btn = $("checkBtn");
  btn.disabled = true; setStatus("", "Comprobando " + state.results.length + " uniones con AISC 360-10…");
  try {
    const r = await fetch("/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows: state.results }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok){
      setStatus("bad", `Error al comprobar (${r.status})`, JSON.stringify(data, null, 2));
    } else {
      state.checked = data.rows || [];
      state.status = state.results.map((_, i) => {
        const c = data.rows[i];
        return (c && c.cumple) ? "CUMPLE" : "NO CUMPLE";
      });
      renderResults();
      renderCheckResults();
      setStatus("ok", "Comprobación AISC 360-10 finalizada.");
    }
  } catch (e){
    setStatus("bad", "Error enviando la comprobación", e.message);
  }
  btn.disabled = !state.results.length;
};

/* =====================================================================
   Marcado y envío de conexiones validadas
   ===================================================================== */
$("markValid").onclick = () => {
  // Solo marca (anade); nunca desmarca.
  state.marked = state.marked.map((m, i) => m || state.status[i] === "CUMPLE");
  renderResults();
};

$("markMod").onclick = () => {
  // Solo marca (anade); nunca desmarca.
  state.marked = state.marked.map((m, i) => m || state.status[i] === "MODIFICADO");
  renderResults();
};

$("sendMarked").onclick = async () => {
  const rows = state.results.filter((_, i) => state.marked[i]);
  if (!rows.length){ setStatus("bad", "No hay conexiones marcadas."); return; }
  if (!confirm("Aseguro que los registros corresponden a conexiones validadas.\n\n¿Enviar " + rows.length + " conexiones marcadas al dataset de reentreno?")) return;

  const btn = $("sendMarked");
  btn.disabled = true;
  setStatus("", "Enviando " + rows.length + " conexiones marcadas…");
  try {
    const r = await fetch("/dataset/append", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok){
      setStatus("bad", `Error al guardar (${r.status})`, JSON.stringify(data, null, 2));
    } else {
      setStatus("ok", `Guardadas: ${data.added} nuevas, ${data.updated} actualizadas (total ${data.total_rows} filas).`);
    }
  } catch (e){
    setStatus("bad", "Error enviando las conexiones marcadas", e.message);
  }
  updateSendMarked();
};

/* =====================================================================
   Carga de modelos y esquema
   ===================================================================== */
async function loadModels(){
  try{
    const r = await fetch("/models");
    const o = await r.json();
    const sel = $("model");
    const models = o.available_models || [];
    sel.innerHTML = models.map(m => `<option value="${escAttr(m)}">${escHtml(m)}</option>`).join("");
    if (o.default_model && models.includes(o.default_model)) sel.value = o.default_model;
  } catch(e){ /* sin modelos */ }
}

async function loadSchema(){
  const model = $("model").value;
  if (!model) return;
  try{
    const r = await fetch("/schema?model=" + encodeURIComponent(model));
    if (!r.ok) throw new Error("HTTP " + r.status);
    SCHEMA = await r.json();
    renderForm(); renderTable();
    $("sub").textContent = `Modelo: ${SCHEMA.model}. Los campos se generan según el modelo.`;
  } catch (e){
    setStatus("bad", "No se pudo cargar el esquema del modelo", e.message);
  }
}
$("model").onchange = () => {
  state.rows = []; state.results = []; state.checked = []; state.marked = []; state.status = [];
  renderTable(); renderResults(); renderCheckResults(); loadSchema();
};

loadModels().then(loadSchema);
</script>
</body>
</html>
